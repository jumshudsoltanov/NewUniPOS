<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <title>MIDA Sniper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 220px;
      font-family: "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      padding: 16px;
    }

    h2 {
      font-size: 15px;
      font-weight: 700;
      color: #00d4aa;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 10px;
      color: #666;
      margin-bottom: 14px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1a1d27;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 14px;
      border: 1px solid #2a2d3a;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff4444;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .dot.active {
      background: #00d4aa;
      box-shadow: 0 0 6px #00d4aa88;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #statusText {
      font-size: 12px;
      color: #999;
    }

    #statusText.active { color: #00d4aa; }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 9px 0;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    #startBtn {
      background: linear-gradient(135deg, #00d4aa, #0099ff);
      color: #000;
    }

    #stopBtn {
      background: #2a2d3a;
      color: #ff6666;
      border: 1px solid #ff444433;
    }

    #startBtn:disabled { opacity: 0.35; cursor: default; }
    #stopBtn:disabled  { opacity: 0.35; cursor: default; }

    .info {
      margin-top: 12px;
      font-size: 10px;
      color: #444;
      line-height: 1.5;
      border-top: 1px solid #1e2130;
      padding-top: 10px;
    }
  </style>
</head>
<body>

  <h2>🎯 MIDA Sniper</h2>
  <div class="subtitle">Avtomatik klik robotu</div>

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="statusText">Dayandırılıb</span>
  </div>

  <div class="btn-row">
    <button id="startBtn">▶ Başlat</button>
    <button id="stopBtn" disabled>■ Dayan</button>
  </div>

  <div class="info">
    Aktiv olanda: Ax → Təsdiqlə →<br>
    Razı deyiləm — hər 50ms avtomatik.
  </div>

  <script src="popup.js"></script>
</body>
</html>
