<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<title>UniPOS Desktop Application</title>
<style>
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes up-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    color: #0a1e4d;
    font-family: "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  .card {
    position: relative;
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    padding: 40px 44px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .top {
    display: flex;
    align-items: center;
    gap: 20px;
    animation: up-in 0.5s 0.1s ease both;
  }

  .logo-box {
    position: relative;
    width: 74px;
    height: 74px;
    flex: none;
  }
  .logo-ring {
    position: absolute;
    inset: -11px;
    border-radius: 50%;
    border: 2px solid rgba(10, 30, 77, 0.07);
    border-top-color: #0a1e4d;
    animation: spin 0.9s linear infinite;
  }
  .logo-shadow {
    position: absolute;
    inset: 10px 8px 0;
    border-radius: 18px;
    background: #0a1e4d;
    filter: blur(12px);
    opacity: 0.18;
    transform: translateY(8px);
  }
  .logo {
    position: relative;
    display: block;
    width: 74px;
    height: 74px;
    object-fit: contain;
  }

  .titles {
    display: flex;
    flex-direction: column;
    gap: 10px;
    animation: up-in 0.5s 0.35s ease both;
  }
  .brand {
    display: flex;
    align-items: baseline;
    font-size: 30px;
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .brand b { font-weight: 700; }
  .brand span { font-weight: 400; color: #8b96b4; }
  .tagline {
    font: 600 11px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #8b96b4;
  }

  .bottom {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    font: 400 12px/1 "Segoe UI", system-ui, sans-serif;
    animation: up-in 0.5s 0.55s ease both;
  }
  #boot { color: #8b96b4; }
  #ver { color: #c2cadc; }

  .bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: #eef1f8;
    animation: up-in 0.5s 0.55s ease both;
  }
  /* Qeyri-müəyyən zolaq: faiz göstərmir, çünki açılışın nə qədər çəkəcəyi
     əvvəlcədən bilinmir. Əvvəl 2.5 saniyəyə sayan SAXTA faiz var idi və
     proqram hazır olandan sonra da pəncərə onu gözləyirdi. */
  #bar-fill {
    height: 100%;
    width: 38%;
    background: #0a1e4d;
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(300%); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="logo-box">
        <div class="logo-shadow"></div>
        <div class="logo-ring"></div>
        <img class="logo" src="../static/images/logo-build.png" alt="UniPOS" onerror="this.style.display='none'" />
      </div>
      <div class="titles">
        <div class="brand"><b>UniPOS</b><span>.tech</span></div>
        <div class="tagline">HORECA System</div>
      </div>
    </div>

    <div class="bottom">
      <div id="boot"></div>
      <div id="ver"></div>
    </div>

    <div class="bar"><div id="bar-fill"></div></div>
  </div>

  <script>
    // Mərhələ adları da saxta idi (taymerlə dəyişirdi), ona görə sadə bir
    // sətirlə əvəz olundu. Zolaq CSS ilə öz-özünə hərəkət edir.
    document.getElementById("boot").textContent = "yüklənir";

    var version = new URLSearchParams(location.search).get("v");
    if (version) document.getElementById("ver").textContent = "v" + version;
  </script>
</body>
</html>
