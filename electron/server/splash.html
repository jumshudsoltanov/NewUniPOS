<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<title>UniPOS</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: "Segoe UI", Arial, sans-serif;
  }

  .logo-wrap {
    position: relative;
    width: 100px;
    height: 100px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: fade-in 0.5s ease 0.1s forwards;
  }
  .logo-shadow {
    position: absolute;
    inset: 14px;
    border-radius: 20px;
    background: #0a1e4d;
    filter: blur(16px);
    opacity: 0.14;
  }
  .logo-spinner {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid #e9edf7;
    border-top-color: #0a1e4d;
    animation: spin 0.9s linear infinite;
  }
  .logo {
    position: relative;
    width: 74px;
    height: 74px;
    object-fit: contain;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .brand {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: #0a1e4d;
    margin-bottom: 28px;
    opacity: 0;
    animation: fade-in 0.5s ease 0.35s forwards;
  }
  .brand .tech {
    color: #8b96b4;
    font-weight: 400;
  }

  @keyframes fade-in {
    to { opacity: 1; }
  }

  .bar-track {
    width: 200px;
    height: 4px;
    border-radius: 3px;
    background: #eef1f8;
    overflow: hidden;
    opacity: 0;
    animation: fade-in 0.4s ease 0.55s forwards;
  }
  .bar-fill {
    width: 35%;
    height: 100%;
    border-radius: 3px;
    background: #0a1e4d;
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(390%); }
  }
</style>
</head>
<body>
  <div class="logo-wrap">
    <div class="logo-shadow"></div>
    <div class="logo-spinner"></div>
    <img class="logo" src="../static/images/logo-build.png" alt="UniPOS" onerror="this.style.display='none'" />
  </div>
  <div class="brand">UniPOS<span class="tech">.tech</span></div>
  <div class="bar-track"><div class="bar-fill"></div></div>
</body>
</html>
