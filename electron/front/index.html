<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="UniPOS Mobile POS" />
  <meta name="theme-color" content="#053796" />
  <meta property="og:title" content="UniPOS Mobile POS" />
  <meta property="og:description" content="UniPOS Point of Sale — Mobile Terminal" />
  <meta property="og:image" content="/favicon.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:55667 http://localhost:5173;" /> -->
  <title>UniPOS Mobile POS</title>
  <script>
    // Desktopda adi UniPOS olaraq deyis
    if (window.innerWidth >= 992 && !/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
      document.title = "UniPOS";
      document.querySelector('meta[name="apple-mobile-web-app-title"]').content = "UniPOS";
    }
    // Pinch zoom qarshisi
    document.addEventListener('touchmove', function(e) {
      if (e.scale && e.scale !== 1) e.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
  </script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html {
      height: -webkit-fill-available;
      overflow: hidden;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      height: -webkit-fill-available;
      overflow: hidden;
      background-color: #E2E5EB !important;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: none;
    }
    #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      background-color: #E2E5EB;
    }
    @media (max-width: 991px) {
      body {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
      }
    }
    .tables-scroll-container, .checks-list, .check-content {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: none;
    }
  </style>
</head>

<body style="background-color: #F3F4F6;">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
