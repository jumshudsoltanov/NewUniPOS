<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="UniPOS Mobile POS" />
  <meta name="theme-color" content="#053796" />
  <meta property="og:title" content="UniPOS Mobile POS" />
  <meta property="og:description" content="UniPOS Point of Sale — Mobile Terminal" />
  <meta property="og:image" content="/favicon.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <title>UniPOS Desktop Application</title>
  <script>
    if (window.innerWidth >= 992 && !/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
      document.title = "UniPOS";
      document.querySelector('meta[name="apple-mobile-web-app-title"]').content = "UniPOS";
    }
    document.addEventListener('touchmove', function(e) {
      if (e.scale && e.scale !== 1) e.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    (function() {
      if (!/iPhone|iPad|iPod/i.test(navigator.userAgent)) return;
      document.documentElement.classList.add('ios-device');
      if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
        document.documentElement.classList.add('ios-standalone');
      }
      var h = window.innerHeight;
      document.documentElement.style.setProperty('--app-height', h + 'px');
      document.documentElement.style.height = h + 'px';
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html {
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E2E5EB;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
      overscroll-behavior: none;
    }
    #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E2E5EB;
    }
    .tables-scroll-container, .checks-list, .check-content {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: none;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
